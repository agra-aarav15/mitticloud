name: Build Node 22 for Android

# Builds libnode.so for Android from nodejs-mobile's Node 22 tree, with ICU
# enabled, and publishes it as a release asset the APK workflow consumes.
#
# WHY NODE 22 AND NOT ICU-ON-18
# The decision is evidence-led, not preference. The ZCode client bundle that
# MittiCloud must run on the phone (glm/zcode.cjs) requires:
#   * node:sea      — added in Node 20.12
#   * node:sqlite   — added in Node 22.5
#   * globalThis.crypto — added in Node 19
# Measured on desktop: Node 18 exits 0 with ZERO protocol output ("No such
# built-in module: node:sqlite"); shimming node:sea then fails with "crypto is
# not defined"; Node 20 emits real protocol output; Node 22 emits real protocol
# output. So the bundle is a Node 20+/22 program, and no amount of ICU on Node
# 18 can supply node:sea.
#
# Node 22 also makes the whole mitti-node22-shim.cjs unnecessary: node:sqlite is
# native, the Unicode property escapes compile natively, and Intl is real.
#
# SOURCE
# nodejs-mobile has no released Node 22 for Android. The tree is the open PR
# #150 ("Update22-9-0. fixed ios and android builds") on branch update22-9-0;
# that PR is what makes the Android build work at all. We pin its head SHA for
# reproducibility instead of tracking a moving branch.
#
# TWO DELIBERATE PATCHES TO THAT TREE
#   1. --with-intl=none -> small-icu   (same reason as always: Unicode escapes
#      and Intl do not exist without ICU)
#   2. nothing else. I first also tried re-enabling WebAssembly, on the theory
#      that the client bundle mentions it. That FAILED, and the log said why:
#      deps/v8/src/handles/handles.h:147 "static assertion failed: This handle
#      does not reference a heap object", raised while compiling exactly the
#      wasm files (wasm-to-js-tq-csa.cc, js-to-wasm-tq-csa.cc) and
#      setup-isolate-full.o. PR #150 turns WebAssembly off because this V8 tree
#      does not compile with it on; that is an upstream decision, not a size
#      trim to be second-guessed. So we keep the tree as its author left it.

on:
  push:
    tags:
      - 'node22-icu-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # PR #150 head — the commit that fixes the Android build for Node 22.
  NODEJS_MOBILE_SHA: 36f2685a46e342f616b5d3c3178b5cbcda78fef7
  # NDK r26d is what that branch's own workflow uses.
  ANDROID_API: '24'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
          - abi: armeabi-v7a
            arch: arm
          - abi: x86_64
            arch: x86_64
    steps:
      - name: Check out MittiCloud
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # gcc/g++ + multilib for Node's HOST tools; python3 for configure and
          # the ICU trimming step.
          sudo apt-get install -y build-essential gcc-multilib g++-multilib python3 unzip curl

      - name: Set up the Android NDK (r26d)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Check out the Node 22 tree at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/nodejs-mobile/nodejs-mobile.git "$RUNNER_TEMP/nodejs-mobile"
          cd "$RUNNER_TEMP/nodejs-mobile"
          git fetch --depth 1 origin "$NODEJS_MOBILE_SHA"
          git checkout "$NODEJS_MOBILE_SHA"
          echo "--- HEAD ---"
          git log --oneline -1
          echo "--- declared Node version ---"
          grep -E 'NODE_MAJOR_VERSION|NODE_MINOR_VERSION|NODE_PATCH_VERSION' src/node_version.h | head -3

      - name: Patch 1 — enable ICU (--with-intl=none becomes small-icu)
        run: |
          cd "$RUNNER_TEMP/nodejs-mobile"
          f=android_configure.py
          grep -qF -- '--with-intl=none' "$f" || { echo "expected --with-intl=none in $f"; exit 1; }
          sed -i 's/--with-intl=none/--with-intl=small-icu/' "$f"
          echo "--- configure line after patching ---"
          grep -n 'with-intl' "$f"
          grep -qF -- '--with-intl=small-icu' "$f" || { echo "ICU patch did not apply"; exit 1; }

      - name: Patch 2 — for the 32-bit target, stop gyp linking host tools as i386
        if: matrix.arch == 'arm'
        run: |
          # Measured on the Node 18 run: the arm job logged
          #   g++ -rdynamic -m64 -m32 -fPIC -o .../gen-regexp-special-case ...
          # for its HOST tools, so the link was i386 while ICU's host objects
          # were compiled x86-64, and it died with "architecture of input file
          # ... is incompatible with i386 output". The arm64 job logged
          # "-m64 -m64" for the same tools and succeeded. Host tools always run
          # on this x86-64 runner, so a -m32 on a *.host.mk is wrong by
          # definition, whatever gyp condition produced it.
          #
          # android_build.sh runs configure and make back to back, so the
          # correction has to be inserted between them — patching the script is
          # the only place it can happen without reimplementing the build.
          f="$RUNNER_TEMP/nodejs-mobile/tools/android_build.sh"
          python3 - "$f" <<'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          anchor = '  make -j $(getconf _NPROCESSORS_ONLN)'
          if anchor not in src:
            sys.exit('anchor "make -j" not found in android_build.sh')
          if 'mitticloud: drop bogus -m32' in src:
            print('already patched')
            sys.exit(0)
          fix = (
            "  # mitticloud: drop bogus -m32 from host tool makefiles. Host tools\n"
            "  # run on the x64 runner; -m32 makes their links i386 and they fail\n"
            "  # against x86-64 host objects. Verified on the Node 18 build.\n"
            "  find out -name '*.host.mk' -exec sed -i 's/ -m32//g' {} + 2>/dev/null || true\n"
          )
          src = src.replace(anchor, fix + anchor, 1)
          open(path, 'w', encoding='utf-8').write(src)
          print('inserted the host -m32 strip before make')
          PYEOF
          grep -n -A1 "drop bogus -m32" "$f" | head -6

      - name: Build libnode.so for ${{ matrix.abi }}
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd "$RUNNER_TEMP/nodejs-mobile"
          ./tools/android_build.sh "$NDK" "$ANDROID_API" "${{ matrix.arch }}"

      - name: Strip the debug sections (the APK ships this file three ABIs over)
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          so="$RUNNER_TEMP/nodejs-mobile/out_android/${{ matrix.abi }}/libnode.so"
          test -f "$so" || { echo "no libnode.so"; find "$RUNNER_TEMP/nodejs-mobile/out_android" -type f | head; exit 1; }
          before=$(stat -c %s "$so")
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" \
            --strip-debug --strip-unneeded "$so" "$so.stripped"
          mv "$so.stripped" "$so"
          after=$(stat -c %s "$so")
          echo "stripped: $before -> $after bytes"

      - name: Verify every property we depend on, in the built file
        run: |
          so="$RUNNER_TEMP/nodejs-mobile/out_android/${{ matrix.abi }}/libnode.so"
          fail=0

          echo "--- 1. node::Start exported (the launcher calls exactly this) ---"
          readelf -sW "$so" | grep -q '_ZN4node5StartEiPPc' || { echo "FAIL: node::Start missing"; fail=1; }

          echo "--- 2. ICU compiled in ---"
          readelf -sW "$so" | grep -qiE 'u_strToLower|U_ICU_VERSION|icu_7[0-9]::' || { echo "FAIL: no ICU symbols"; fail=1; }

          echo "--- 3. no external libicu dependency (we ship only this file) ---"
          if readelf -dW "$so" | grep -i NEEDED | grep -qi icu; then
            echo "FAIL: depends on an external ICU library"; readelf -dW "$so" | grep -i NEEDED; fail=1
          fi

          echo "--- 4. node:sqlite and node:sea are compiled in (the whole point) ---"
          # These are JS-level builtins, not exported symbols, so search the
          # embedded source strings the binary carries.
          for token in 'node:sqlite' 'node:sea'; do
            if strings -a "$so" | grep -qF "$token"; then echo "found $token"; else echo "FAIL: $token not present"; fail=1; fi
          done

          echo "--- 5. WebAssembly ---"
          # PR #150 builds this tree with v8_enable_webassembly=0 and that is
          # fine: measured on desktop Node 22, the client bundle emits identical
          # protocol output (1644 bytes) with WebAssembly unavailable, because
          # it only reaches for wasm lazily (the date-time-format-timezone
          # polyfill, which real ICU makes unnecessary). Reported, not required.
          if strings -a "$so" | grep -qiE 'WebAssembly'; then
            echo "note: WebAssembly strings present"
          else
            echo "note: no WebAssembly strings (expected for this tree)"
          fi

          echo "--- runtime deps ---"
          readelf -dW "$so" | grep -i NEEDED || true

          [ "$fail" = "0" ] || { echo "verification failed"; exit 1; }
          echo "all checks passed for ${{ matrix.abi }}"

      - name: Upload this ABI's libnode.so
        uses: actions/upload-artifact@v4
        with:
          name: libnode22-${{ matrix.abi }}
          path: ${{ runner.temp }}/nodejs-mobile/out_android/${{ matrix.abi }}/libnode.so
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download every ABI
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/libs

      - name: Lay the files out as bin/<abi>/libnode.so
        run: |
          cd "$RUNNER_TEMP/libs"
          ls -la
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "out/bin/$abi"
            cp "libnode22-$abi/libnode.so" "out/bin/$abi/libnode.so"
          done
          find out -type f -exec ls -la {} \;

      # The release tag deliberately does NOT match this workflow's push
      # trigger (node22-icu-v*), or creating the release would re-trigger it.
      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="libnode22-icu-node22.9.0-smallicu"
          zipname="libnode22-icu-v22.9.0.zip"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "Node 22.9.0 for Android with ICU (small-icu)" \
              --notes "libnode.so built from nodejs-mobile PR #150 (update22-9-0, $NODEJS_MOBILE_SHA) with --with-intl=small-icu and WebAssembly re-enabled. Node 22 supplies node:sea, node:sqlite and globalThis.crypto, which the ZCode client bundle requires. Consumed by .github/workflows/apk.yml."
          fi
          cd "$RUNNER_TEMP/libs/out"
          zip -q -r "$zipname" bin
          ls -la "$zipname"
          gh release upload "$tag" "$zipname" --repo "${{ github.repository }}" --clobber
          echo "published: $tag / $zipname"

      - name: Keep the merged artifact too
        uses: actions/upload-artifact@v4
        with:
          name: libnode22-icu-all-abis
          path: ${{ runner.temp }}/libs/out
          if-no-files-found: error