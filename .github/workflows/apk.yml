name: Build APK

# Builds the signed MittiCloud Android APK. Runs on every version tag (v*) and
# on manual dispatch. The keystore and its passwords come from repository
# secrets, never from the repo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Real Linux verification: the server suite, plus a native build + functional
    # test of the PTY helper (a glibc host is the closest stand-in for Android's
    # bionic here — same forkpty ABI).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Server test suite
        run: npm test
      - name: Compile the PTY helper natively
        run: cc -O2 -Wall -Wextra -o /tmp/mittish android/app/src/main/cpp/mittish.c -lutil || cc -O2 -Wall -Wextra -o /tmp/mittish android/app/src/main/cpp/mittish.c
      - name: Functionally test the PTY helper (a real shell over a PTY)
        run: |
          set -e
          # 1. The helper must give the child a TTY (isatty true) — the whole point.
          out=$(MITTI_PTY_ROWS=24 MITTI_PTY_COLS=80 /tmp/mittish /bin/sh -c 'if [ -t 0 ] && [ -t 1 ]; then echo TTY_OK; else echo NO_TTY; fi')
          echo "$out"
          echo "$out" | grep -q TTY_OK || { echo "the child had no terminal"; exit 1; }
          # 2. It must be interactive: feed a command on stdin and confirm it RAN.
          #    Checked via a file side-effect, not scrollback — reading the pty's
          #    output races the shell's exit, but the file is deterministic.
          rm -f /tmp/mittish_proof
          printf 'echo PIPE_$((6*7)) > /tmp/mittish_proof\nexit\n' | MITTI_PTY_ROWS=24 /tmp/mittish /bin/sh || true
          cat /tmp/mittish_proof 2>/dev/null || { echo "input did not reach the shell"; exit 1; }
          grep -q PIPE_42 /tmp/mittish_proof || { echo "input did not reach the shell"; exit 1; }
          # 3. A resize request on fd 3 must reach the child's terminal size.
          printf 'R 40 120\n' > /tmp/ctl.txt
          out2=$(/tmp/mittish /bin/sh -c 'sleep 0.4; stty size' 3</tmp/ctl.txt || true)
          echo "size=$out2"
          echo "$out2" | grep -q '^40 120' || { echo "resize did not reach the terminal"; exit 1; }
          # 4. Exit code must pass through (a failing command reports failure).
          /tmp/mittish /bin/sh -c 'exit 7' && { echo "expected exit 7"; exit 1; } || test $? -eq 7
          echo "PTY helper verified"

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Fetch the nodejs-mobile runtime (prebuilt libnode, no build)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nodejs-mobile.zip"             "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip"
          mkdir -p "$RUNNER_TEMP/nodejs-mobile" && unzip -q "$RUNNER_TEMP/nodejs-mobile.zip" -d "$RUNNER_TEMP/nodejs-mobile"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p android/app/src/main/jniLibs/$abi
            cp "$RUNNER_TEMP/nodejs-mobile/bin/$abi/libnode.so" android/app/src/main/jniLibs/$abi/
          done

      - name: Bundle libc++_shared.so from the NDK (libnode.so needs it at runtime)
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          for pair in arm64-v8a:aarch64-linux-android armeabi-v7a:arm-linux-androideabi x86_64:x86_64-linux-android; do
            abi="${pair%%:*}"; triple="${pair##*:}"
            src=$(find "$NDK/toolchains/llvm/prebuilt" -path "*/sysroot/usr/lib/$triple/libc++_shared.so" | head -1)
            test -n "$src" || { echo "libc++_shared.so not found for $abi"; exit 1; }
            cp "$src" "android/app/src/main/jniLibs/$abi/"
          done

      - name: Build the runnable Node launcher (libmittinode.so)
        run: |
          # Android refuses to exec anything an app can write, so a hosted app
          # cannot be started from app storage. The APK's native library folder
          # IS executable, so this real PIE executable is shipped there under a
          # .so name. It loads its sibling libnode.so and calls node::Start.
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          # The host tag (linux-x86_64) varies, so locate the toolchain by probing.
          BIN=$(find "$NDK/toolchains/llvm/prebuilt" -type f -name "aarch64-linux-android24-clang" | head -1)
          test -n "$BIN" || { echo "NDK clang not found"; exit 1; }
          TOOLCHAIN=$(dirname "$BIN")
          for pair in arm64-v8a:aarch64-linux-android24 armeabi-v7a:armv7a-linux-androideabi24 x86_64:x86_64-linux-android24; do
            abi="${pair%%:*}"; trip="${pair##*:}"
            CC="$TOOLCHAIN/${trip}-clang"
            test -x "$CC" || { echo "compiler not found: $CC"; exit 1; }
            "$CC" -O2 -fPIE -pie -Wall -Wextra \
              -o "android/app/src/main/jniLibs/$abi/libmittinode.so" \
              android/app/src/main/cpp/mittinode.c
          done
          ls -la android/app/src/main/jniLibs/*/libmittinode.so

      - name: Bundle cloudflared as the public-link connector (libmittitunnel.so)
        run: |
          # "Get a public link" must work with nothing to install — the user is
          # a beginner on a phone. The official cloudflared Linux builds are
          # STATIC Go binaries: they resolve DNS only from /etc/resolv.conf,
          # which Android does not have, so on the phone they die with
          # "lookup ... connection refused" (and contain no RESOLV_CONF
          # override). Termux ships the SAME version rebuilt with the Android
          # NDK, so it resolves through Android itself — that build is what we
          # bundle. It is a PIE executable, so it ships under a .so name in the
          # native-library folder (the one place Android lets an app execute).
          set -e
          VER="2026.10.0"
          BASE="https://packages.termux.dev/apt/termux-main/pool/main/c/cloudflared"
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          STRIP=""
          for c in "$NDK/toolchains/llvm/prebuilt/"*/bin/llvm-strip; do
            [ -x "$c" ] && STRIP="$c" && break
          done
          [ -n "$STRIP" ] || STRIP=$(command -v llvm-strip || command -v strip || true)
          test -n "$STRIP" || { echo "no usable strip tool found"; exit 1; }
          for pair in aarch64:arm64-v8a arm:armeabi-v7a x86_64:x86_64; do
            arch="${pair%%:*}"; abi="${pair##*:}"
            curl -fsSL -o /tmp/cf.deb "$BASE/cloudflared_${VER}_${arch}.deb"
            rm -rf /tmp/cfx && mkdir -p /tmp/cfx
            ( cd /tmp/cfx && ar x /tmp/cf.deb && tar xf data.tar.xz 2>/dev/null || true )
            BIN=/tmp/cfx/data/data/com.termux/files/usr/bin/cloudflared
            test -f "$BIN" || { echo "cloudflared binary missing in $arch deb"; exit 1; }
            # Real sanity check: it must be the Android build (linker64), not a
            # static Linux binary — otherwise the phone DNS bug returns.
            file "$BIN" | grep -q "interpreter /system/bin/linker" \
              || { echo "$abi cloudflared is not an Android build"; file "$BIN"; exit 1; }
            "$STRIP" "$BIN" || echo "warn: strip failed on $abi"
            cp "$BIN" "android/app/src/main/jniLibs/$abi/libmittitunnel.so"
          done
          ls -la android/app/src/main/jniLibs/*/libmittitunnel.so

      - name: Build the PTY helper (libmittish.so)
        run: |
          # A full interactive shell needs a real terminal. mittish allocates a
          # PTY (forkpty, in bionic since API 23; minSdk 24) and proxies bytes,
          # so isatty() is true and the client can resize. Same packaging trick
          # as the Node launcher: a PIE executable under a .so name, so Android
          # extracts it into the executable native-library folder.
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          BIN=$(find "$NDK/toolchains/llvm/prebuilt" -type f -name "aarch64-linux-android24-clang" | head -1)
          test -n "$BIN" || { echo "NDK clang not found"; exit 1; }
          TOOLCHAIN=$(dirname "$BIN")
          for pair in arm64-v8a:aarch64-linux-android24 armeabi-v7a:armv7a-linux-androideabi24 x86_64:x86_64-linux-android24; do
            abi="${pair%%:*}"; trip="${pair##*:}"
            CC="$TOOLCHAIN/${trip}-clang"
            test -x "$CC" || { echo "compiler not found: $CC"; exit 1; }
            "$CC" -O2 -fPIE -pie -Wall -Wextra \
              -o "android/app/src/main/jniLibs/$abi/libmittish.so" \
              android/app/src/main/cpp/mittish.c
          done
          ls -la android/app/src/main/jniLibs/*/libmittish.so

      - name: Stage the server into the APK assets
        run: |
          mkdir -p android/app/src/main/assets/mitti
          cp -r server public package.json android/app/src/main/assets/mitti/
          rm -rf android/app/src/main/assets/mitti/server/test
          cd android/app/src/main/assets/mitti && npm install --omit=dev --no-audit --no-fund

      - name: Restore the release keystore
        env:
          KS_B64: ${{ secrets.MITTI_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mitticloud-release.jks"

      - name: Build and sign the release APK
        working-directory: android
        env:
          MITTI_KEYSTORE: ${{ runner.temp }}/mitticloud-release.jks
          MITTI_KEYSTORE_PASSWORD: ${{ secrets.MITTI_KEYSTORE_PASSWORD }}
          MITTI_KEY_ALIAS: mitticloud
          MITTI_KEY_PASSWORD: ${{ secrets.MITTI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename and verify the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(node -p "require('./package.json').version")
          cp "$APK" "MittiCloud-v${VERSION}.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "MittiCloud-v${VERSION}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "MittiCloud-v${VERSION}.apk" | grep -q "lib/$abi/libc++_shared.so" || { echo "APK is missing libc++_shared.so for $abi"; exit 1; }
            unzip -l "MittiCloud-v${VERSION}.apk" | grep -q "lib/$abi/libmittinode.so" || { echo "APK is missing libmittinode.so for $abi"; exit 1; }
            unzip -l "MittiCloud-v${VERSION}.apk" | grep -q "lib/$abi/libmittish.so" || { echo "APK is missing libmittish.so for $abi"; exit 1; }
            unzip -l "MittiCloud-v${VERSION}.apk" | grep -q "lib/$abi/libmittitunnel.so" || { echo "APK is missing libmittitunnel.so for $abi"; exit 1; }
          done
          echo "APK_NAME=MittiCloud-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "MittiCloud ${GITHUB_REF_NAME}" --notes "Signed Android APK for ${GITHUB_REF_NAME}." --verify-tag
          gh release upload "${GITHUB_REF_NAME}" "$APK_NAME" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: mitticloud-apk
          path: MittiCloud-v*.apk
