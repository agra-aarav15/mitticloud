<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0f13">
  <meta name="description" content="MittiCloud — turn an old drawer phone into your free personal cloud.">
  <title>MittiCloud — Your drawer-phone is a cloud now.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏺</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-emoji" aria-hidden="true">🏺</span>
      <div class="brand-text">
        <h1>MittiCloud <span id="version-badge" class="badge">…</span></h1>
        <p class="tagline">Your drawer-phone is a cloud now.</p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="MittiCloud sections">
    <button class="tab" role="tab" id="tab-status" aria-selected="true" aria-controls="panel-status">🧭 Status</button>
    <button class="tab" role="tab" id="tab-photos" aria-selected="false" aria-controls="panel-photos" tabindex="-1">🖼️ Photos</button>
    <button class="tab" role="tab" id="tab-files" aria-selected="false" aria-controls="panel-files" tabindex="-1">🗂️ Files</button>
  </nav>

  <main class="wrap">
    <!-- ============ STATUS ============ -->
    <section id="panel-status" class="panel" role="tabpanel" aria-labelledby="tab-status" tabindex="0">
      <div id="demo-banner" class="banner" hidden>
        <span class="banner-text">⚠️ Termux not detected — showing demo data.</span>
        <button id="banner-dismiss" class="icon-btn banner-dismiss" aria-label="Dismiss demo notice">✕</button>
      </div>

      <div class="status-grid">
        <article class="card">
          <h2>Battery <span id="battery-mock-pill" class="pill" hidden>demo</span></h2>
          <div class="battery-row">
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 120 120" width="116" height="116" role="img" aria-label="Battery level">
                <circle class="ring-track" cx="60" cy="60" r="52" stroke-width="10" fill="none"></circle>
                <circle id="battery-arc" class="ring-arc" cx="60" cy="60" r="52" stroke-width="10" fill="none" stroke-linecap="round" transform="rotate(-90 60 60)"></circle>
                <text id="battery-level-text" class="ring-text" x="60" y="62" text-anchor="middle" dominant-baseline="middle">–</text>
              </svg>
              <span id="battery-bolt" class="bolt" hidden aria-hidden="true">⚡</span>
            </div>
            <div class="battery-meta">
              <p id="battery-charging" class="battery-state">—</p>
              <p id="battery-temp" class="muted">—</p>
            </div>
          </div>
        </article>

        <article class="card">
          <h2>Storage <span id="storage-mock-pill" class="pill" hidden>demo</span></h2>
          <div id="storage-bar" class="bar" role="progressbar" aria-label="Storage used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="storage-fill" class="bar-fill"></div>
          </div>
          <p id="storage-label" class="muted storage-label">—</p>
        </article>

        <article class="card">
          <h2>Device</h2>
          <p id="device-line">—</p>
          <p id="uptime-line" class="muted">—</p>
        </article>

        <article class="card">
          <h2>Tunnel</h2>
          <p id="tunnel-mode">—</p>
          <p id="tunnel-hint" class="muted">—</p>
        </article>
      </div>
    </section>

    <!-- ============ PHOTOS ============ -->
    <section id="panel-photos" class="panel" role="tabpanel" aria-labelledby="tab-photos" tabindex="0" hidden>
      <div class="toolbar">
        <input id="photo-input" type="file" multiple accept="image/*" hidden>
        <button id="photo-upload-btn" class="btn btn-primary">⬆️ Upload Photos</button>
        <button id="photo-refresh" class="btn">🔄 Refresh</button>
        <span id="upload-state" class="upload-state" hidden role="status">
          <span class="spinner" aria-hidden="true"></span> Uploading…
        </span>
      </div>
      <div id="photos-grid" class="photos-grid" aria-live="polite"></div>
    </section>

    <!-- ============ FILES ============ -->
    <section id="panel-files" class="panel" role="tabpanel" aria-labelledby="tab-files" tabindex="0" hidden>
      <div class="toolbar">
        <button id="files-up" class="btn">⬆️ Up</button>
        <button id="files-mkdir" class="btn">📁 New Folder</button>
      </div>
      <nav id="files-breadcrumbs" class="breadcrumbs" aria-label="Folder path"></nav>
      <div id="files-list" class="card list"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>MittiCloud · free &amp; open source · runs on the phone in your drawer</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
